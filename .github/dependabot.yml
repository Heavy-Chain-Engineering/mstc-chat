version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Dockerfile's base images (node, python, uv), pinned to exact versions.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
