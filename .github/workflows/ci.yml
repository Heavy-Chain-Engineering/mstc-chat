name: CI

# Runs on every push to main and every pull request, with the plain pull_request trigger. It holds
# no secrets and can only read the repository, so a pull request from a fork cannot reach
# anything of value. Every action is pinned to a full commit SHA, the only immutable reference
# GitHub offers; Dependabot's github-actions entry proposes new pins.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          uv sync --locked
          npm --prefix frontend ci --ignore-scripts

      # File hygiene, YAML/TOML/JSON syntax, private keys and Ruff formatting. The hooks that
      # have their own step below are skipped here; the staged-files Gitleaks hook would scan
      # nothing in CI, so the secret-scan job scans the history instead.
      - name: Commit hooks on all files
        env:
          SKIP: gitleaks,ruff-check,mypy,tsc,eslint,prettier
        run: uv run --with pre-commit pre-commit run --all-files --show-diff-on-failure

      - name: Ruff
        run: uv run ruff check backend tests

      - name: Mypy
        run: uv run mypy backend

      - name: Python tests with coverage (at least 80%)
        run: uv run pytest --cov --cov-report=xml -q

      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        run: uv run --with diff-cover diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

      - name: TypeScript
        run: npm --prefix frontend run -s typecheck

      - name: ESLint
        run: npm --prefix frontend run -s lint

      - name: Prettier
        run: npm --prefix frontend run -s format:check

      - name: Frontend tests
        run: npm --prefix frontend run -s test

      - name: Dependency audit
        run: |
          uv run pip-audit
          npm --prefix frontend audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Gitleaks is built from its Go module, which Go's checksum database verifies; its
      # licensed GitHub Action is not used. Keep this version in step with
      # .pre-commit-config.yaml, because Dependabot updates neither.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0

      # Proves the scan below works: a token-shaped value made up at run time is committed and
      # then deleted in a throwaway repository, so it exists only in history. Gitleaks must
      # fail, name the file and the commit, and print no part of the value.
      - name: Prove the scan fails on a secret in old history
        run: |
          set -euo pipefail
          probe="$(mktemp -d "$RUNNER_TEMP/leak-probe.XXXXXX")"
          git -C "$probe" init -q
          git -C "$probe" config user.name "CI probe"
          git -C "$probe" config user.email "ci-probe@example.com"
          token="ghp_$(openssl rand -hex 18)"
          printf 'GITHUB_TOKEN=%s\n' "$token" > "$probe/settings.txt"
          git -C "$probe" add settings.txt
          git -C "$probe" commit -q -m "add settings"
          git -C "$probe" rm -q settings.txt
          git -C "$probe" commit -q -m "remove settings"
          status=0
          gitleaks git --redact --verbose --no-banner --exit-code 1 "$probe" > "$probe.out" 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "Gitleaks exited $status on a history that holds a token; it must exit 1."
            exit 1
          fi
          if grep -qF "$token" "$probe.out"; then
            echo "Gitleaks printed the token's value; it must redact it."
            exit 1
          fi
          grep -q "File: *settings.txt" "$probe.out" || { echo "Gitleaks did not name the file."; exit 1; }
          grep -qE "Commit: *[0-9a-f]{40}" "$probe.out" || { echo "Gitleaks did not name the commit."; exit 1; }
          echo "Gitleaks failed on the throwaway history, named the file and the commit, and hid the value."

      - name: Scan the whole git history for secrets
        run: gitleaks git --redact --verbose --no-banner --exit-code 1 --log-opts="--all" .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A dummy .env in the build folder proves .dockerignore keeps it out of the image.
      - name: Plant a dummy .env
        run: printf 'CLASS_PASSWORD=ci-dummy-value\n' > .env

      # The Dockerfile's check=error=true turns every build-check finding, such as a
      # secret-shaped ARG or ENV, into a failure. The image stays on the runner; nothing pushes.
      - name: Build the image without pushing
        run: docker build --tag mstc-chat:ci .

      - name: Check the image holds no .env and runs as a non-root user
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh mstc-chat:ci -c \
            'test ! -e /app/.env || { echo "The image holds /app/.env."; exit 1; }'
          uid="$(docker run --rm --entrypoint id mstc-chat:ci -u)"
          [ "$uid" != "0" ] || { echo "The image runs as root."; exit 1; }
