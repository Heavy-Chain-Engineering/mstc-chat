[project]
name = "mstc-chat"
version = "0.1.0"
description = "A live lecture chat room, and a spec-driven development demo."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pip-audit",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E/F/W: errors, I: import order, B: bugbear, UP: modern syntax, S: security rules.
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
# A new project has no real figure yet, so the floor starts at the first goal. Long-term: 85%.
fail_under = 80
show_missing = true
